[package]
name = "ort-session"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
log = "0.4"
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
rknn-runtime = { path = "../rknn-runtime" }

[features]
default = []
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
migraphx = ["ort/migraphx"]
